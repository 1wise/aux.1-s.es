# Timestamp: 2026-11-10 | Version: 7.0.0-dev.4
# Author and Credits: https://www.alawise.es/1-s
# Keep disk selection, partition confirmation, users and bootloader destination interactive.
# This profile needs a network mirror for the selected packages.
d-i debian-installer/locale string es_ES.UTF-8
d-i keyboard-configuration/xkb-keymap select es
d-i time/zone string Europe/Andorra
d-i netcfg/choose_interface select auto
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string
d-i mirror/suite string testing
d-i apt-setup/non-free-firmware boolean true
d-i apt-setup/non-free boolean true
tasksel tasksel/first multiselect standard
d-i pkgsel/include string linux-image-amd64 task-xfce-desktop network-manager network-manager-gnome chrony sudo python3 python3-pip openssh-server openssh-client tmux ncurses-bin dialog qrencode cockpit cockpit-storaged cockpit-networkmanager cockpit-packagekit bash-completion nano less file pciutils usbutils lsof strace rsync curl wget git unzip xorriso squashfs-tools util-linux parted gparted gdisk cryptsetup lvm2 mdadm btrfs-progs xfsprogs e2fsprogs dosfstools exfatprogs ntfs-3g smartmontools nvme-cli gddrescue testdisk sleuthkit iproute2 iputils-ping dnsutils ethtool tcpdump nmap iperf3 firmware-linux firmware-iwlwifi firmware-realtek firmware-atheros firmware-brcm80211 firmware-sof-signed
