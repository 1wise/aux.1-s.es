# Timestamp: 2026-11-11 | Version: 7.0.0-beta.19
# Author & Credits: https://www.alawise.es/1-s
# Mouse events must reach tmux to navigate remote pane history.
set -g mouse on
set -g history-limit 20000
set -g default-terminal tmux-256color
set -g default-shell /bin/bash
set -g status off
# The pane owns the history while the browser renders tmux's alternate screen.
# Quiet options preserve keyboard history on older tmux versions without scrollbars.
set -gqw pane-scrollbars on
set -gqw pane-scrollbars-position right
set -gqw pane-scrollbars-style 'fg=colour51,bg=colour54,width=2,pad=0'
bind-key -n S-PPage copy-mode -eu
bind-key -n S-NPage copy-mode -ed
bind-key -T copy-mode S-PPage send-keys -X page-up
bind-key -T copy-mode S-NPage send-keys -X page-down
bind-key -T copy-mode-vi S-PPage send-keys -X page-up
bind-key -T copy-mode-vi S-NPage send-keys -X page-down
