set default=0
set timeout_style=menu
set timeout=5
set color_normal=green/black
set menu_color_normal=green/black
set menu_color_highlight=blue/black

# AUX WAN BEGIN
menuentry 'W.A.N Arsenal iPXE - Excalibur' --id aux-wan-arsenal {
    if [ "$grub_platform" = "efi" ]; then
        if [ "$grub_cpu" = "x86_64" ]; then
            insmod chain
            chainloader /ipxe/ipxe.efi
        else
            echo 'This iPXE payload requires x86_64 UEFI.'
            sleep 5
        fi
    elif [ "$grub_platform" = "pc" ]; then
        insmod linux16
        linux16 /ipxe/ipxe.lkrn
    else
        echo 'This iPXE payload requires x86 BIOS or x86_64 UEFI.'
        sleep 5
    fi
}
# AUX WAN END
menuentry 'Restart computer' {
    reboot
}
menuentry 'Shut down computer' {
    halt
}
