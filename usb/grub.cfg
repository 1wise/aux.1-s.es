set default=0
set timeout_style=menu
set timeout=5
set color_normal=green/black
set menu_color_normal=green/black
set menu_color_highlight=blue/black

menuentry 'WAN Arsenal / iPXE network boot' {
    if [ "$grub_platform" = "efi" ]; then
        chainloader /ipxe/ipxe.efi
    else
        linux16 /ipxe/ipxe.lkrn
    fi
}
menuentry 'Restart computer' {
    reboot
}
menuentry 'Shut down computer' {
    halt
}
